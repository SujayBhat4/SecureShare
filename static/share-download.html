<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared file · SecureShare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>try { var t = localStorage.getItem("ss_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="public-page">
  <main class="public-card card">
    <div class="brand brand-center">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><g transform="translate(7.5 7.5) scale(.375)" stroke-width="4"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></g></svg>
      <span>SecureShare</span>
    </div>

    <!-- Filled in by the script below from GET /s/{token}/info -->
    <div id="file-tile" class="file-tile file-tile-lg skeleton" aria-hidden="true"></div>
    <h1 id="file-name" class="file-name">Loading...</h1>
    <p class="mono muted small" id="file-size">&nbsp;</p>
    <p class="muted small">Shared securely with SecureShare</p>
    <p class="muted small" id="expiry-line">&nbsp;</p>

    <!-- The Download button goes to /s/{token}/download, which logs the download first -->
    <a id="download-btn" class="btn btn-primary btn-lg btn-block" href="#" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      Download
    </a>
    <p class="muted tiny footer-note">This access is being recorded.</p>
  </main>

  <script src="/static/js/ui.js"></script>
  <script>
    // The link token is the second part of the address: /s/<token>
    const token = location.pathname.split("/")[2];

    // Asks the server for the file details and fills in the page
    async function loadInfo() {
      const response = await fetch(`/s/${token}/info`);
      const data = await response.json();
      if (!response.ok) {
        document.getElementById("file-name").textContent = data.detail || "This link is no longer available";
        document.getElementById("file-tile").remove();
        document.getElementById("download-btn").remove();
        document.getElementById("expiry-line").textContent = "Ask the sender for a new link.";
        return;
      }
      const tile = document.getElementById("file-tile");
      const ext = fileExtension(data.original_name);
      tile.classList.remove("skeleton");
      tile.dataset.ext = ext;
      tile.textContent = ext.toUpperCase();
      document.getElementById("file-name").textContent = data.original_name;
      document.getElementById("file-size").textContent = formatBytes(data.size_bytes);
      document.getElementById("expiry-line").textContent = "Link expires on " + formatDateTime(data.expires_at);
      const button = document.getElementById("download-btn");
      button.href = `/s/${token}/download`;
      button.removeAttribute("aria-disabled");
    }

    loadInfo();
  </script>
</body>
</html>
